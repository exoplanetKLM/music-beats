<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>音乐跳动</title>
  <!-- 移动端分享体验：安卓地址栏配色 / iOS 添加到主屏幕全屏运行 / 内联 favicon -->
  <meta name="theme-color" content="#0a0a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="音乐跳动">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a14'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%2300e5ff'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 游戏画布：所有画面都画在这里 -->
  <canvas id="game"></canvas>

  <!-- 游戏内 HUD：分数 / 连击 / 进度条（悬浮在画布上） -->
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="combo" class="hidden">0 连击</div>
    <!-- 奖励时间横幅（2026-09-20 新增）：金色标题 + 倒计时 -->
    <div id="bonus" class="hidden">
      <span id="bonus-title">★ 奖励时间 ★</span>
      <span id="bonus-count">15</span>
    </div>
    <!-- 护盾（2026-09-20 新增）：电脑按 A（2026-09-23 由 K 改），手机点左下角按钮 -->
    <div id="shield-state"></div>
    <div id="shield-btn" role="button">护盾</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <!-- 开始界面 -->
  <div id="menu" class="screen">
    <h1 class="title">音乐跳动</h1>
    <!-- 开始游戏 / 音乐选择 / 玩法说明（2026-09-21：三首歌与各曲最高分都合并进「音乐选择」弹窗）
         这块必须仍是 #menu 的最后一个子元素：.screen > :last-child 的 margin-bottom:auto
         是结构选择器、不看 display，挂到里面那个 hidden 的 #song-hint 上会把整列顶到底部 -->
    <div id="menu-actions">
      <button id="btn-start" class="btn btn-primary">开始游戏</button>
      <div id="menu-row">
        <!-- 按钮上带当前曲名：歌曲都收进弹窗后，这是开始界面唯一能看出「现在放哪首」的地方 -->
        <button id="btn-music" class="btn btn-ghost btn-compact">音乐选择 · No.9</button>
        <button id="btn-how-to" class="btn btn-ghost btn-compact">玩法说明</button>
      </div>
      <p id="song-hint" class="hidden"></p>
    </div>
  </div>

  <!-- 结束界面 -->
  <div id="gameover" class="screen hidden">
    <h1 class="title-over">游戏结束</h1>
    <p id="final-score"></p>
    <p id="new-record" class="hidden">🎉 新纪录！</p>
    <p id="final-best"><span id="final-best-song">《No.9》</span>最高分 <span id="final-best-value">0</span></p>
    <button id="btn-restart" class="btn btn-primary">再来一局</button>
    <button id="btn-home" class="btn btn-ghost">返回首页</button>
  </div>

  <!-- 玩法说明弹窗（2026-09-21：原开始界面底部常驻面板改成弹窗）
       首次进入自动弹出并把「看过」记进 localStorage（CONFIG.howToKey），之后再进入不弹；
       开始界面「开始游戏」旁的「玩法说明」按钮随时可再打开。
       位置是硬约束：放 #menu 里会被 .hidden 连带隐藏；放 SONG_DATA 段里会被单文件构建替换掉。 -->
  <div id="how-to-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="how-to-title">
    <div class="modal-card">
      <button id="howto-close" class="modal-close" aria-label="关闭">✕</button>
      <!-- 沿用旧 id="how-to"：style.css 里既有的排版规则原样继续生效 -->
      <div id="how-to">
        <p id="how-to-title" class="how-to-title modal-title">玩法说明</p>
        <p>踩中节拍点得分，连击越高分越高（金星双倍）</p>
        <p>躲开红色障碍（浮空障碍要贴地通过），碰到即结束</p>
        <p>30 秒后蓝色巨障跳不过去：按 A / 点左下按钮开盾撞破</p>
        <p>护盾持续 1.5 秒（按下后 4 秒可再按），且只对蓝色巨障有效</p>
        <p class="hint-sub">电脑：点击 / J / 空格 / ↑ / W 跳跃，A 开护盾　·　手机：点屏幕跳跃、点左下按钮开盾</p>
      </div>
      <button id="howto-ok" class="btn btn-primary btn-compact">知道了</button>
    </div>
  </div>

  <!-- 音乐选择弹窗（2026-09-21：原来平铺在开始界面的三首歌 + 各曲最高分榜单，合并到这里）
       每行 = 歌名 + 该曲最高分 + 「使用中」标记，行由 game.js 按 SONGS 生成（以后加歌不用改这里）；
       点一行只是高亮选中，按「确定」才生效并关闭（✕ / 点遮罩 / Esc = 取消，不改动当前曲目）。
       位置同玩法说明弹窗：必须是 body 直接子元素（放进 #menu 会被 .hidden 连带隐藏），
       且在 SONG_DATA 段之前（那段会被单文件构建整段替换）。 -->
  <div id="song-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="song-modal-title">
    <div class="modal-card">
      <button id="song-close" class="modal-close" aria-label="关闭">✕</button>
      <p id="song-modal-title" class="modal-title">选择背景音乐</p>
      <div id="song-rows"></div>
      <button id="music-ok" class="btn btn-primary btn-compact">确定</button>
    </div>
  </div>

  <!-- 歌曲数据（18 首约 78MB）按需加载策略（2026-09-21 改，2026-09-23 扩到 18 首）：
         · 只加载「当前选中的那一首」：game.js 在解码前 await window.__loadSongScript(id, file)；
         · 本地双击（file://）：动态注入同目录的 song-data*.js——经典脚本不受 file:// 的
           CORS 限制（只有 fetch/XHR/ES 模块受限），秒开、断网也能玩；
         · 线上（GitHub Pages）：走 jsDelivr CDN（国内比 GitHub Pages 快约 10 倍），
           同样只请求需要的那一首——曲库 18 首约 78MB，但首屏仍只下一首（约 4~5MB）；
         · 注入失败 resolve(false) 并删掉记录：换歌/重选会重新注入，失败态不会被永久钉死；
         · 慢链路兜底仍在 game.js：超时先放行（用合成音乐开打），数据到位后自动换上。
       单文件打包（build-single.js）会把 SONG_DATA 标记之间的整段替换为
       「__loadSongScript 短路桩 + __SINGLE_SONG_IDS + 内联数据」。单文件版**刻意只内置
       5 首**（全量内联会让产物从 20MB 涨到约 78MB）；game.js 按 __SINGLE_SONG_IDS 把
       弹窗滤成那 5 首，所以一行都不用为单文件版特判。 -->
  <!-- SONG_DATA:START -->
  <script>
    (function () {
      var local = location.protocol === 'file:';
      var base = 'https://cdn.jsdelivr.net/gh/exoplanetKLM/music-beats@master/';
      // file → Promise<boolean>：已注入过的数据脚本。成功就长期保留（重复请求直接命中）；
      // 失败则删掉记录，下次换歌/重选还能再来一次。
      var injected = {};
      window.__loadSongScript = function (id, file) {
        if (!file) return Promise.resolve(true); // 没写 file 字段：当作数据已就位
        if (injected[file]) return injected[file];
        var p = new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = local ? file : base + file;
          s.async = true;
          // 经典脚本：onload 触发时脚本已执行完，全局变量必定就位
          s.onload = function () { resolve(true); };
          s.onerror = function () {
            delete injected[file]; // onerror 永远晚于下面那行赋值
            console.warn('歌曲数据脚本加载失败：' + s.src);
            resolve(false);        // 只 resolve(false)，绝不 reject
          };
          (document.head || document.body).appendChild(s);
        });
        injected[file] = p;
        return p;
      };
    })();
  </script>
  <!-- SONG_DATA:END -->
  <script src="game.js"></script>
</body>
</html>
