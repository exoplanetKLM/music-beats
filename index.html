<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>音乐跳动</title>
  <!-- 移动端分享体验：安卓地址栏配色 / iOS 添加到主屏幕全屏运行 / 内联 favicon -->
  <meta name="theme-color" content="#0a0a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="音乐跳动">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a14'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%2300e5ff'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 游戏画布：所有画面都画在这里 -->
  <canvas id="game"></canvas>

  <!-- 游戏内 HUD：分数 / 连击 / 进度条（悬浮在画布上） -->
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="combo" class="hidden">0 连击</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <!-- 开始界面 -->
  <div id="menu" class="screen">
    <h1 class="title">音乐跳动</h1>
    <div id="song-picker">
      <p id="song-picker-label">背景音乐</p>
      <div id="song-buttons">
        <button class="btn-song" data-song="no9">No.9</button>
        <button class="btn-song" data-song="sugar-free">Sugar Free</button>
        <button class="btn-song" data-song="sexy-love">Sexy Love</button>
      </div>
    </div>
    <div id="best-list">
      <p id="best-list-label">各曲最高分</p>
      <div id="best-rows"></div>
    </div>
    <button id="btn-start" class="btn btn-primary">开始游戏</button>
    <p class="hint">踩中节拍得分，躲开障碍！</p>
    <p class="hint-sub">电脑：点击 / 空格键跳跃　·　手机：点屏幕跳跃</p>
  </div>

  <!-- 结束界面 -->
  <div id="gameover" class="screen hidden">
    <h1 class="title-over">游戏结束</h1>
    <p id="final-score"></p>
    <p id="new-record" class="hidden">🎉 新纪录！</p>
    <p id="final-best"><span id="final-best-song">《No.9》</span>最高分 <span id="final-best-value">0</span></p>
    <button id="btn-restart" class="btn btn-primary">再来一局</button>
    <button id="btn-home" class="btn btn-ghost">返回首页</button>
  </div>

  <script src="song-data.js"></script>
  <script src="song-data-sugar-free.js"></script>
  <script src="song-data-sexy-love.js"></script>
  <script src="game.js"></script>
</body>
</html>
